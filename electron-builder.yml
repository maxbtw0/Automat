appId: de.automat.editor
productName: Automat
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
win:
  # Installer und portable Version (eine .exe ohne Installation)
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  oneClick: false
  # Für alle Benutzer nach C:\Program Files (fragt einmal nach Adminrechten)
  perMachine: true
  include: build/installer.nsh
  allowToChangeInstallationDirectory: true
  # Ein Installer pro Architektur: x64 (Intel/AMD) und arm64
  artifactName: ${productName} Setup ${version} ${arch}.${ext}
portable:
  # Entpackt sich bei jedem Start nach %TEMP%, keine Adminrechte nötig
  artifactName: ${productName} ${version} ${arch} portable.${ext}
